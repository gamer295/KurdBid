<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KurdBid | Marketplace</title>
    
    <!-- GitHub Pages Redirector for Root Hosting -->
    <script type="text/javascript">
      (function() {
        var isGitHubPages = window.location.hostname.includes('github.io');
        var isRoot = window.location.pathname === '/' || window.location.pathname.split('/').pop() === '';
        // If we are on GH Pages and at root, redirect to docs/ where the build is
        if (isGitHubPages && isRoot && !window.location.search.includes('v=')) {
          var path = window.location.pathname;
          if (!path.endsWith('/')) path += '/';
          window.location.href = path + 'docs/index.html';
        }
      })();
    </script>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#FFD700" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KurdBid" />
    <link rel="apple-touch-icon" href="https://picsum.photos/seed/kurdbid/192/192" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
